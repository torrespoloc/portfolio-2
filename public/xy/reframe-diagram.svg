<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" width="720" height="240">
  <defs>
    <style>
      .bg-l { fill: #F5F4F0; }
      .bg-r { fill: #EEF2FF; }
      .str { stroke: #e0e0e0; stroke-width: 1.5; }
      .str-b { stroke: #4361EE; stroke-width: 2; }
      .f-m { fill: #d0d0d0; }
      .f-b { fill: #4361EE; }
      .f-w { fill: white; }
      .t-m { fill: #999; font-family: system-ui, sans-serif; }
      .t-b { fill: #4361EE; font-family: system-ui, sans-serif; }
      .t-d { fill: #757575; font-family: system-ui, sans-serif; }
    </style>
  </defs>

  <!-- BEFORE panel -->
  <rect x="10" y="10" width="320" height="220" rx="16" class="bg-l str"/>
  <text x="170" y="42" text-anchor="middle" font-weight="700" font-size="12" class="t-m" letter-spacing="3">BEFORE</text>

  <!-- Document icon 1 -->
  <g transform="translate(170, 75)">
    <rect x="-22" y="-16" width="44" height="32" rx="4" class="f-w str"/>
    <polygon points="12,-16 22,-6 12,-6" class="f-w str"/>
    <line x1="-12" y1="-3" x2="12" y2="-3" class="f-m" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-12" y1="3" x2="8" y2="3" class="f-m" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Form field icon on document -->
    <rect x="-12" y="-9" width="18" height="4" rx="1.5" fill="#e0e0e0"/>
  </g>

  <!-- Arrow 1 -->
  <polygon points="170,108 165,103 175,103" class="f-m"/>
  <line x1="170" y1="97" x2="170" y2="105" class="f-m" stroke-width="1.5"/>

  <!-- Document icon 2 -->
  <g transform="translate(170, 120)">
    <rect x="-22" y="-16" width="44" height="32" rx="4" class="f-w str"/>
    <polygon points="12,-16 22,-6 12,-6" class="f-w str"/>
    <line x1="-12" y1="-3" x2="12" y2="-3" class="f-m" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-12" y1="3" x2="8" y2="3" class="f-m" stroke-width="1.5" stroke-linecap="round"/>
    <rect x="-12" y="-9" width="10" height="4" rx="1.5" fill="#e0e0e0"/>
  </g>

  <!-- Arrow 2 -->
  <polygon points="170,153 165,148 175,148" class="f-m"/>
  <line x1="170" y1="142" x2="170" y2="150" class="f-m" stroke-width="1.5"/>

  <!-- Document icon 3 -->
  <g transform="translate(170, 165)">
    <rect x="-22" y="-16" width="44" height="32" rx="4" class="f-w str"/>
    <polygon points="12,-16 22,-6 12,-6" class="f-w str"/>
    <line x1="-12" y1="-3" x2="12" y2="-3" class="f-m" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-12" y1="3" x2="4" y2="3" class="f-m" stroke-width="1.5" stroke-linecap="round"/>
    <rect x="-12" y="-9" width="14" height="4" rx="1.5" fill="#e0e0e0"/>
  </g>

  <!-- Multiple pages hint -->
  <text x="170" y="202" text-anchor="middle" font-size="11" class="t-d" font-weight="500">3 separate pages to configure</text>

  <!-- Arrow divider -->
  <g transform="translate(360, 120)">
    <circle cx="0" cy="0" r="18" fill="none" stroke="#4361EE" stroke-width="2" opacity="0.3"/>
    <polygon points="-6,-8 6,0 -6,8" fill="#4361EE" opacity="0.5"/>
  </g>

  <!-- AFTER panel -->
  <rect x="380" y="10" width="320" height="220" rx="16" class="bg-r str-b"/>
  <text x="540" y="42" text-anchor="middle" font-weight="700" font-size="12" class="t-b" letter-spacing="3">AFTER</text>

  <!-- Person icon (user) -->
  <g transform="translate(430, 75)">
    <circle cx="0" cy="-8" r="7" class="f-w" stroke="#4361EE" stroke-width="1.5"/>
    <path d="M-10,12 Q-10,-2 0,-2 Q10,-2 10,12" class="f-w" stroke="#4361EE" stroke-width="1.5" fill="none"/>
  </g>

  <!-- User chat bubble -->
  <rect x="450" y="65" width="230" height="32" rx="16" class="f-b"/>
  <text x="466" y="85" text-anchor="start" font-family="system-ui, sans-serif" font-size="12" fill="white" font-weight="500">Set up an agent for claims</text>

  <!-- Gear icon (system) -->
  <g transform="translate(570, 115)">
    <circle cx="0" cy="0" r="8" class="f-w" stroke="#4361EE" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="3" fill="none" stroke="#4361EE" stroke-width="1.5"/>
  </g>

  <!-- System chat bubble -->
  <rect x="395" y="110" width="165" height="32" rx="16" class="f-w" stroke="#d0d0d0" stroke-width="1"/>
  <text x="412" y="130" text-anchor="start" font-family="system-ui, sans-serif" font-size="12" fill="#4d4d4d" font-weight="500">I'll guide you through it</text>

  <!-- Person icon (user) -->
  <g transform="translate(430, 160)">
    <circle cx="0" cy="-8" r="7" class="f-w" stroke="#4361EE" stroke-width="1.5"/>
    <path d="M-10,12 Q-10,-2 0,-2 Q10,-2 10,12" class="f-w" stroke="#4361EE" stroke-width="1.5" fill="none"/>
  </g>

  <!-- User chat bubble 2 -->
  <rect x="450" y="150" width="230" height="32" rx="16" class="f-b"/>
  <text x="466" y="170" text-anchor="start" font-family="system-ui, sans-serif" font-size="12" fill="white" font-weight="500">Connect Gmail &amp; get started</text>

  <!-- Result indicator -->
  <rect x="470" y="200" width="140" height="20" rx="10" fill="#4361EE" opacity="0.12"/>
  <g transform="translate(488, 210)">
    <circle cx="0" cy="0" r="4" fill="#4361EE"/>
    <polygon points="-2,0 0,3 4,-2" fill="none" stroke="#4361EE" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="500" y="214" text-anchor="start" font-family="system-ui, sans-serif" font-size="10" fill="#4361EE" font-weight="600">One conversation. Done.</text>
</svg>
