<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  background:transparent;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  padding:24px;
  color:#e8e8ed;
  display:flex;align-items:center;justify-content:center;
  min-height:100%;
}
.steps{
  display:flex;align-items:center;gap:8px;
  flex-wrap:wrap;justify-content:center;
}
.step{
  background:#0f1a2a;
  border:none;
  border-radius:10px;
  padding:14px 18px;
  text-align:center;
  min-width:140px;
}
.step .icon{font-size:20px;margin-bottom:4px;display:block;}
.step .name{font-size:12px;font-weight:600;color:#d0d8e8;}
.step .detail{font-size:10px;color:#7788aa;margin-top:2px;}
.arrow{font-size:18px;color:#4466aa;flex-shrink:0;}
.outcome{
  background:#0c1a2e;
  border:none;
  border-radius:10px;
  padding:14px 18px;
  text-align:center;
}
.outcome .icon{font-size:20px;margin-bottom:4px;display:block;}
.outcome .name{font-size:12px;font-weight:600;color:#7dd4c0;}
</style>
</head>
<body>
<div class="steps">
  <div class="step"><span class="icon">🎨</span><span class="name">Figma</span><span class="detail">Design + prototypes</span></div>
  <span class="arrow">→</span>
  <div class="step"><span class="icon">🤖</span><span class="name">Claude Design</span><span class="detail">Design system tokens</span></div>
  <span class="arrow">→</span>
  <div class="step"><span class="icon">⌨️</span><span class="name">Claude Code</span><span class="detail">SwiftUI implementation</span></div>
  <span class="arrow">+</span>
  <div class="step"><span class="icon">🔌</span><span class="name">Figma MCP</span><span class="detail">Design → code bridge</span></div>
  <span class="arrow">→</span>
  <div class="outcome"><span class="icon">⬡</span><span class="name">SideNook v1.0</span></div>
</div>
</body>
</html>
